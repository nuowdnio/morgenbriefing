name: Briefing starten

on:
  schedule:
    # Ziel: Start um 05:40 Uhr deutscher Zeit, damit die Mail gegen 6 Uhr da ist.
    # GitHub rechnet in UTC. Das Programm wählt selbst den richtigen Lauf,
    # deshalb stimmt die Zeit auch nach der Zeitumstellung. Der letzte Eintrag ist die Reserve.
    - cron: "40 3 * * *"
    - cron: "40 4 * * *"
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      mail:
        description: "Briefing auch per Mail schicken"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      built: ${{ steps.briefing.outputs.built }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Modelle aus dem Zwischenspeicher laden
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.cache/fastembed
          key: modelle-v1-${{ hashFiles('requirements.txt') }}
          restore-keys: modelle-v1-

      - name: Programme installieren
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Tests
        run: |
          python -m pytest -q
          node --test tests/app.test.js

      - name: Briefing erstellen
        id: briefing
        run: |
          export FASTEMBED_CACHE_PATH="$HOME/.cache/fastembed"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m briefing.main --skip-if-today --not-before 05:00
          else
            python -m briefing.main
          fi

      - name: Archiv speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Briefing $(date -u +%F)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  mail:
    needs: [build, deploy]
    if: needs.build.outputs.built == 'true' && (github.event_name == 'schedule' || inputs.mail)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install PyYAML==6.0.3

      - name: Briefing als Mail verschicken
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          python -m briefing.mail_issue --owner "$OWNER" --repo "$REPO" --title-file /tmp/title.txt --body-file /tmp/body.md
          gh label create briefing --color 1747b5 --description "Tägliches Briefing" --force
          gh issue create --title "$(cat /tmp/title.txt)" --body-file /tmp/body.md --label briefing
