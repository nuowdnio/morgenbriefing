name: Übersetzer vergleichen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Programme installieren
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: 20 aktuelle Meldungen mit beiden Modellen übersetzen
        run: python -m briefing.compare_translators >> "$GITHUB_STEP_SUMMARY"
