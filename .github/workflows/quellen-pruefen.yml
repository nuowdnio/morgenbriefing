name: Quellen prüfen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install feedparser==6.0.14 PyYAML==6.0.3 requests==2.34.2 numpy==2.5.4 scikit-learn==1.9.1
      - name: Alle Feeds testen
        run: python -m briefing.check_feeds --all >> "$GITHUB_STEP_SUMMARY"
