# Einstellungen für dein Morgenbriefing. Änderungen gelten ab dem nächsten Lauf.
# Anleitung: siehe README.md

settings:
  timezone: Europe/Berlin
  lookback_hours: 24          # Meldungen der letzten X Stunden
  stale_after_hours: 72       # Feed gilt als veraltet, wenn der neueste Eintrag älter ist
  max_items_per_source: 40
  max_stories_per_topic: 8
  max_stories_total: 60
  top_count: 5
  archive_days: 30
  max_summary_sentences: 3
  max_summary_chars: 480
  max_detail_chars: 700       # Obergrenze je Quelle beim Ausklappen, damit keine Volltexte gespeichert werden

  # Schutz: Fällt zu viel aus, bricht der Lauf ab und das letzte Briefing bleibt online.
  min_sources_ok: 6
  min_stories: 12

  # Gruppierung gleicher Ereignisse: höher = strenger.
  embedding_model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  similarity_threshold: 0.62
  fallback_similarity_threshold: 0.35   # nur falls das Modell nicht geladen werden kann

  translator: argos           # argos oder opus (siehe README, Abschnitt Übersetzer)
  target_language: de

  user_agent: "MorgenbriefingBot/1.0 (privater RSS-Leser)"
  request_timeout_seconds: 20
  max_feed_bytes: 5000000

ranking:
  sources: 3.0                # mehrere unabhängige Quellen zählen am stärksten
  regions: 1.5                # Berichte aus mehreren Weltregionen
  recency: 1.0
  source_weight: 1.0
  recency_half_life_hours: 12
  diversity_penalty: 0.18     # bremst Regionen, die im Briefing schon häufig vorkommen

exclude:
  title_patterns:
    - '^Anzeige\b'
    - '^Live\b'
    - '\+\+\+'
    - 'Liveticker'
    - 'Live-?[Bb]log'
    - 'as it happened'
    - 'Latest news bulletin'
    - 'Books in brief'
    - 'Briefing Chat'
    - '^Daily briefing'
    - '^Photos?:'
    - '^Watch:'
    - '^Video:'
    - '^Schlagzeilen$'
    - '\(g\+\)'             # Bezahlartikel bei Golem
    - 'heise\+'
  url_patterns:
    - '/video/'
    - '/videos/'
    - '/liveblog/'
    - '/live/'
    - '/opinions?/'
    - '/opinionista/'
    - '/meinung/'
    - '/gallery/'
    - '/newsticker/'
    - '/podcasts?/'
    - '/ratgeber/'
    - '/plus/'
    - '/stat-plus/'
    - '/premium/'
    - '-blog-[0-9]+\.html'

# Reihenfolge = Reihenfolge auf der Seite. "weight" dämpft Themen für die Top 5.
